  <!-- Decorative Flourish Right -->
  <path d="M1150 380 
           C1250 300, 1250 200, 1100 220
           C1200 160, 1100 120, 1020 200"
        stroke="#0b3d2e" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Small Leaf Details -->
